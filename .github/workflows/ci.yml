name: CI

# Plain Ruby runners (no test framework dependency): the shared conformance corpus (conformance.rb), the Rack
# middleware and 0.4.1 suites, and the mutation-kill registry.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    # run 44388990538: no hang; the job is ~10 min of replays plus a ~21 min kill registry on 4 cores, so 30 min cut a green job off
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-26.04 (OpenSSL 3.5) gives the openssl extension ML-DSA; ubuntu-24.04 (OpenSSL 3.0) exercises the
        # path where it is missing and the ML-DSA vectors must be skipped, never passed or failed
        # (Ruby 3.1/3.2 on OpenSSL 3.5 reject valid Ed25519 vectors in 0.4.1: an open compatibility finding, not run here)
        os: [ubuntu-26.04]
        ruby: ['3.3', '3.4']
        include:
          - { os: ubuntu-24.04, ruby: '3.3' }
          - { os: windows-latest, ruby: '3.3' }
          - { os: macos-latest, ruby: '3.3' }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Full adversarial corpus from the flagship
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --layout $([ "$RUNNER_OS" = Windows ] || echo --less)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RSA DPoP oracle corpus (generated, never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "$PWD/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated, never committed)
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$PWD/test-data" oprf:oprf core-frost-java:core-frost-java mpc-ot:mpc-ot attest-eat:attest-eat abe:abe frost-dkg:frost-dkg
      - uses: ruby/setup-ruby@v1
        if: ${{ !cancelled() }} # a failed corpus generator must not leave the system ruby (no ffi, old OpenSSL) running every test
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: libsodium and ffi (the ratchet's ristretto255 group)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libsodium-dev libicu-dev; else brew install libsodium icu4c; fi
          gem install ffi ffi-icu --no-document
      - name: libsodium and ffi on Windows (the FROST ristretto255 group, from the RubyInstaller MSYS2)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          ridk exec pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-libsodium
          gem install ffi --no-document
      - name: Capability ratchet (reference replay and independent known answers)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: ruby -Ilib -Itest test/test_ref_ratchet.rb
      - name: Conformance corpus
        if: ${{ !cancelled() }} # one run shows every failing step
        run: ruby conformance.rb
      - name: Rack middleware
        if: ${{ !cancelled() }} # one run shows every failing step
        run: ruby -Ilib -Itest test/test_middleware.rb
      - name: Rack middleware options (approved_goal, revocation_staleness, require_assurance, plans, executor)
        if: ${{ !cancelled() }} # one run shows every failing step
        run: ruby -Ilib -Itest test/test_middleware_options.rb
      - name: protect(), explain_refusal() and the doc member of refusal bodies
        if: ${{ !cancelled() }} # one run shows every failing step
        run: ruby -Ilib test/test_protect.rb
      - name: Decision, rules 20-21 and escalation answers (shared decision-vectors.json; a missing file fails, never skips)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -s conformance/decision-vectors.json || test -s packages/pca/conformance/decision-vectors.json
          ruby -Ilib test/test_decision.rb
      - name: Caveat language v2 (shared caveat-lang-vectors.json; a missing file fails, never skips)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -s conformance/caveat-lang-vectors.json || test -s packages/pca/conformance/caveat-lang-vectors.json
          ruby -Ilib test/test_caveat_lang.rb
      - name: Forbid-wins certificate and linked policy template vectors (a missing file fails, never skips)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          rc=0 # every command runs; a failure fails the step at the end (bash -e would hide the rest)
          test -s conformance/forbid-certificate-vectors.json || test -s packages/pca/conformance/forbid-certificate-vectors.json || rc=1
          test -s conformance/policy-link-vectors.json || test -s packages/pca/conformance/policy-link-vectors.json || rc=1
          ruby -Ilib test/test_forbid_certificate.rb || rc=1
          ruby -Ilib test/test_policy_link.rb || rc=1
          exit $rc
      - name: Signed agent passport vectors (packages/pca/conformance/passport-vectors.json)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -s conformance/passport-vectors.json || test -s packages/pca/conformance/passport-vectors.json
          ruby -Ilib test/test_passport.rb
      - name: Agent / issuer side (producer vectors byte for byte, round trips, ML-DSA hybrids; a missing file fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        env:
          PCA_REQUIRE_PQ: ${{ matrix.os == 'ubuntu-26.04' && '1' || '0' }} # OpenSSL 3.5: ML-DSA and SLH-DSA signing must work there
          PCA_PRODUCER_OUT: ${{ runner.temp }}/producer-native-ruby.json
        run: |
          test -s conformance/producer-vectors.json || test -s packages/pca/conformance/producer-vectors.json
          ruby -Ilib test/test_agent_producer.rb
          [ "$PCA_REQUIRE_PQ" != 1 ] || test -s "$PCA_PRODUCER_OUT"  # written where post-quantum signing is required
      - name: Upload this SDK's signed artifacts for the reference verifier
        if: ${{ !cancelled() && matrix.os == 'ubuntu-26.04' && matrix.ruby == '3.4' }}
        uses: actions/upload-artifact@v4
        with:
          name: producer-native-ruby
          path: ${{ runner.temp }}/producer-native-ruby.json
          if-no-files-found: error
      - name: Optimistic-path and transparency-ledger vectors (a missing file fails, never skips)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          for f in optimistic-vectors ledger-vectors; do test -s conformance/$f.json || test -s packages/pca/conformance/$f.json; done
          ruby -Ilib test/test_ext_vectors.rb
      - name: Intent-state vectors (accumulators, monitors, history windows, sequencer receipts; a missing file fails, never skips)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          rc=0 # every command runs; a failure fails the step at the end (bash -e would hide the rest)
          test -s conformance/intent-state-vectors.json || test -s packages/pca/conformance/intent-state-vectors.json || rc=1
          ruby -Ilib test/test_intent_state.rb || rc=1
          test -s test-data/base-intenthistory.json.gz || rc=1
          ruby -Ilib -Itest test/test_base_intenthistory.rb || rc=1
          exit $rc
      - name: Mesh proof vectors (a missing file fails, never skips)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -s conformance/mesh-vectors.json || test -s packages/pca/conformance/mesh-vectors.json
          ruby -Ilib test/test_mesh.rb
      - name: Goal-to-decision vectors (packages/pca-conformance/vectors/goal from the flagship layout; a missing corpus fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        run: ruby test/test_goal_vectors.rb
      - name: Goal benchmark (seeded cases, simulated fixtures, four-level evaluation, calibrated report; shared ref-goal-bench corpus) and assurance hooks, PQ suite surface, approval channels, hash suites
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash # the `for` loop below is bash (Windows defaults to pwsh)
        run: |
          rc=0 # every command runs; a failure fails the step at the end (bash -e would hide the rest)
          ruby -Ilib -Itest test/test_ref_goal_bench.rb || rc=1
          ruby -Ilib -Itest test/test_ref_goal_selectors.rb || rc=1
          ruby -Ilib -Itest test/test_assurance_hooks.rb || rc=1
          ruby -Ilib -Itest test/test_verifier_hooks.rb || rc=1
          ruby -Ilib -Itest test/test_pq_surface.rb || rc=1
          ruby -Ilib -Itest test/test_approval_channels.rb || rc=1
          ruby -Ilib -Itest test/test_hash_suite.rb || rc=1
          ruby -Ilib -Itest test/test_small_surface.rb || rc=1
          ruby -Ilib -Itest test/test_server_guard.rb || rc=1
          ruby -Ilib -Itest test/test_chain_compact.rb || rc=1
          ruby -Ilib -Itest test/test_policy_templates.rb || rc=1
          ruby -Ilib -Itest test/test_ref_decide.rb || rc=1
          ruby -Ilib -Itest test/test_undo_coordinator.rb || rc=1
          ruby -Ilib -Itest test/test_ref_core_mesh.rb || rc=1
          ruby -Ilib -Itest test/test_ref_actions_pack.rb || rc=1
          ruby -Ilib -Itest test/test_pq_threshold_experimental.rb || rc=1
          ruby -Ilib -Itest test/test_ref_durable_state.rb || rc=1
          ruby -Ilib -Itest test/test_ref_core_stores.rb || rc=1
          ruby -Ilib -Itest test/test_bond_settlement.rb || rc=1
          ruby -Ilib -Itest test/test_ref_store_conformance.rb || rc=1
          ruby -Ilib -Itest test/test_discovery.rb || rc=1
          ruby -Ilib -Itest test/test_reference_names.rb || rc=1
          ruby -Ilib -Itest test/test_durable_state.rb || rc=1
          ruby -Ilib -Itest test/test_private_file.rb || rc=1
          ruby -Ilib -Itest test/test_strict_json_parsers.rb || rc=1
          ruby -Ilib -Itest test/test_duplicate_member_sites.rb || rc=1
          ruby -Ilib -Itest test/test_undo_stores.rb || rc=1
          ruby -Ilib -Itest test/test_wire_checks.rb || rc=1
          ruby -Ilib -Itest test/test_approvals.rb || rc=1
          ruby -Ilib -Itest test/test_reference_helpers.rb || rc=1
          test -s test-data/ref-agent-native.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_agent_native.rb || rc=1
          for c in beacons action-pin intent-misc2 core-small-surface core-bond-settlement-java core-sweep-java; do test -s test-data/ref-$c.json.gz; done || rc=1
          ruby -Ilib -Itest test/test_ref_sibling_ports.rb || rc=1
          exit $rc
      - name: libada from the pinned release (the URL parser of the QRNG request URLs; the platform gems carry this build)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ada" && cd "$RUNNER_TEMP/ada"
          for f in ada.cpp ada.h ada_c.h; do curl -fsSL --retry 4 -o "$f" "https://github.com/ada-url/ada/releases/download/v4.0.0/$f"; done
          g++ -O2 -std=c++20 -shared -fPIC ada.cpp -o libada.so
          echo "ATLAS_PCA_LIBADA=$RUNNER_TEMP/ada/libada.so" >> "$GITHUB_ENV"
      - name: KEM and entropy (hybrid X25519 + ML-KEM, X-Wing, QRNG mixing; shared reference corpora, a missing file fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        env:
          PCA_REQUIRE_PQ: ${{ matrix.os == 'ubuntu-26.04' && '1' || '0' }} # OpenSSL 3.5: ML-KEM must run there
          PCA_ADA_REQUIRED: ${{ runner.os == 'Linux' && '1' || '0' }} # the request URLs go through Ada there
        run: |
          rc=0 # every command runs; a failure fails the step at the end (bash -e would hide the rest)
          test -s test-data/ref-kem.json.gz || rc=1
          test -s test-data/ref-entropy.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_kem.rb || rc=1
          ruby -Ilib -Itest test/test_ref_entropy.rb || rc=1
          test -s test-data/ref-zk.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_zk_ceremony.rb || rc=1
          ruby -Ilib -Itest test/test_ref_zk.rb || rc=1
          test -s test-data/ref-decide-derive.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_decide_derive.rb || rc=1
          for c in ref-prohibitions ref-contracts base-prohibitions; do test -s test-data/$c.json.gz; done || rc=1
          ruby -Ilib -Itest test/test_ref_prohibitions_contracts.rb || rc=1
          test -s test-data/ref-mesh-issue.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_mesh_issue.rb || rc=1
          test -s test-data/ref-pq-threshold-quorum.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_pq_quorum.rb || rc=1
          test -s test-data/ref-safety-certificate.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_safety_certificate.rb || rc=1
          test -s test-data/ref-catalog.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_catalog.rb || rc=1
          test -s test-data/ref-core-research-java.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_core_research.rb || rc=1
          test -s test-data/ref-budget-forecast.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_budget_forecast.rb || rc=1
          test -s test-data/ref-reputation.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_reputation.rb || rc=1
          test -s test-data/ref-policy-debug.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_policy_debug.rb || rc=1
          test -s test-data/ref-ha.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_ha.rb || rc=1
          test -s test-data/ref-taint.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_taint.rb || rc=1
          test -s test-data/ref-frontier-signals.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_frontier_signals.rb || rc=1
          test -s test-data/ref-objective-risk.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_objective_risk.rb || rc=1
          test -s test-data/ref-progress.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_progress.rb || rc=1
          test -s test-data/ref-attestation-soft.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_attestation_soft.rb || rc=1
          test -s test-data/ref-sevsnp-helpers.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_sevsnp_helpers.rb || rc=1
          test -s test-data/ref-connectors-providers.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_connectors_providers.rb || rc=1
          test -s test-data/ref-attest-pq-software.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_attest_pq_software.rb || rc=1
          test -s test-data/ref-attest-puf.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_attest_puf.rb || rc=1
          test -s test-data/ref-attest-allowlist.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_attest_allowlist.rb || rc=1
          test -s test-data/ref-attest-maa.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_attest_maa.rb || rc=1
          test -s test-data/ref-attest-nvidia.json.gz || rc=1
          test -s test-data/ref-attest-nvidia-rim.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_attest_nvidia.rb || rc=1
          test -s test-data/ref-attest-vendors.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_attest_vendors.rb || rc=1
          test -s test-data/ref-control-blue.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_control_blue.rb || rc=1
          test -s test-data/ref-semantic-threshold.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_semantic_threshold.rb || rc=1
          test -s test-data/ref-passport.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_passport.rb || rc=1
          test -s test-data/ref-beacons.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_beacons.rb || rc=1
          test -s test-data/ref-action-schema.json.gz || rc=1
          test -s test-data/ref-action-schema-draft.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_action_schema.rb || rc=1
          test -s test-data/ref-intent-misc2.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_intent_misc2.rb || rc=1
          test -s test-data/ref-nl-approval.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_nl_approval.rb || rc=1
          test -s test-data/ref-frost-net.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_frost_net.rb || rc=1
          test -s test-data/ref-frost-dkg.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_frost_dkg.rb || rc=1
          test -s test-data/ref-verify-verdict.json.gz || rc=1
          ruby -Ilib -Itest test/test_ref_verify_verdict.rb || rc=1
          ruby -Ilib -Itest test/test_frost_dkg_tls.rb || rc=1
          ruby -Ilib -Itest test/test_frost_net_http.rb || rc=1
          ruby -Ilib -Itest test/test_intent_signed.rb || rc=1
          ruby -Ilib -Itest test/test_surface_gaps.rb || rc=1
          ruby -Ilib -Itest test/test_attest_helpers.rb || rc=1
          exit $rc
      - name: NVIDIA SPDM version rule
        if: ${{ !cancelled() }} # one run shows every failing step
        run: ruby -Ilib test/test_nvidia_spdm_version.rb
      - name: Goal binding v3 (approved_goal commitments, invalid digests, binding rules; a missing file fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -s conformance/goal-commit-vectors.json || test -s packages/pca/conformance/goal-commit-vectors.json
          ruby -Ilib test/test_goal_commit_v3.rb
      - name: Revocation staleness (T9; staleness-vectors.json, a missing file fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -s conformance/staleness-vectors.json || test -s packages/pca/conformance/staleness-vectors.json
          ruby -Ilib test/test_revocation_staleness.rb
      - name: Optional sqlite3 gem (the durable-store tests run when it installs and skip when it does not)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        continue-on-error: true
        run: gem install sqlite3 --no-document
      - name: Operation records (T3; operation-vectors.json scenarios, concurrency, durable store, executor; a missing file fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -s conformance/operation-vectors.json || test -s packages/pca/conformance/operation-vectors.json
          ruby -Ilib test/test_operations.rb
      - name: Plan lifecycle (T10; plan-vectors.json scenarios, concurrency, authorize plans:; a missing file fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -s conformance/plan-vectors.json || test -s packages/pca/conformance/plan-vectors.json
          ruby -Ilib test/test_plan_lifecycle.rb
      - name: Assurance labels and the high-assurance gate (T8 / B7; assurance-vectors.json, a missing file fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -s conformance/assurance-vectors.json || test -s packages/pca/conformance/assurance-vectors.json
          ruby -Ilib test/test_assurance_vectors.rb
      - name: Step-up client for the principal device (RFC 8032 vectors, fake transport)
        if: ${{ !cancelled() }} # one run shows every failing step
        run: ruby -Ilib test/test_stepup.rb
      - name: Store-conformance helper (passes the shipped stores, fails deliberately broken ones)
        if: ${{ !cancelled() }} # one run shows every failing step
        run: ruby -Ilib test/test_store_conformance.rb
      - name: actions-vectors (action-kit, strict ActionDef parse, canonical digest, trait expansion, floor check, ActionSchema v2, pack proofs; a missing corpus fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -d conformance/actions || test -d ../../packages/pca-conformance/vectors/actions
          ruby -Ilib test/test_actions_vectors.rb
      - name: Vendor attestation evidence vectors (AMD SEV-SNP, Intel TDX, Azure MAA, GCP, NVIDIA + strict X.509; the flagship generates the file; a missing file fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -s conformance/attestation-evidence-vectors.json || test -s packages/pca/conformance/attestation-evidence-vectors.json
          ruby -Ilib test/test_attestation_vectors.rb
      - name: Rules 20-21 end to end through authorize (model-rules-vectors.json; a missing file fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -s conformance/model-rules-vectors.json || test -s packages/pca/conformance/model-rules-vectors.json
          ruby -Ilib test/test_model_rules.rb
      - name: K3 operational artifacts (k3-vectors.json, covering policy bundles, decision log, list receipts and grant management; a missing file fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -s conformance/k3-vectors.json || test -s packages/pca/conformance/k3-vectors.json
          ruby -Ilib test/test_k3_vectors.rb
      - name: fresh_at consistency-token member (fresh-at-vectors.json; a missing file fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          test -s conformance/fresh-at-vectors.json || test -s packages/pca/conformance/fresh-at-vectors.json
          ruby -Ilib test/test_fresh_at.rb
      - name: pca_grant authorization-details type (pca-grant-vectors.json; a missing file fails)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          rc=0 # every command runs; a failure fails the step at the end (bash -e would hide the rest)
          test -s conformance/pca-grant-vectors.json || test -s packages/pca/conformance/pca-grant-vectors.json || rc=1
          ruby -Ilib test/test_pca_grant.rb || rc=1
          test -s conformance/blueprint-vectors.json || test -s packages/pca/conformance/blueprint-vectors.json || rc=1
          ruby -Ilib test/test_blueprint.rb || rc=1
          test -s conformance/k4-vectors.json || test -s packages/pca/conformance/k4-vectors.json || rc=1
          ruby -Ilib test/test_k4.rb || rc=1
          test -s conformance/a2a-vectors.json || test -s packages/pca/conformance/a2a-vectors.json || rc=1
          ruby -Ilib test/test_a2a.rb || rc=1
          test -s conformance/workflow-vectors.json || test -s packages/pca/conformance/workflow-vectors.json || rc=1
          test -s conformance/readside-vectors.json || test -s packages/pca/conformance/readside-vectors.json || rc=1
          ruby -Ilib test/test_k5.rb || rc=1
          exit $rc
      - name: K5 vault, aggregate reads and workflow admission inside authorize (shared vectors; a missing file fails, never skips)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          rc=0 # every command runs; a failure fails the step at the end (bash -e would hide the rest)
          test -s conformance/vault-aggregate-vectors.json || test -s packages/pca/conformance/vault-aggregate-vectors.json || rc=1
          ruby -Ilib test/test_k5_vault.rb || rc=1
          test -s conformance/authorize-workflow-fixtures.json || test -s packages/pca/conformance/authorize-workflow-fixtures.json || rc=1
          ruby -Ilib test/test_authorize_workflow.rb || rc=1
          ruby -Ilib test/test_middleware_workflow.rb || rc=1
          test -s conformance/lease-vectors.json || test -s packages/pca/conformance/lease-vectors.json || rc=1
          ruby -Ilib test/test_lease.rb || rc=1
          test -s conformance/obligations-vectors.json || test -s packages/pca/conformance/obligations-vectors.json || rc=1
          ruby -Ilib test/test_obligations.rb || rc=1
          test -s conformance/break-glass-vectors.json || test -s packages/pca/conformance/break-glass-vectors.json || rc=1
          ruby -Ilib test/test_break_glass.rb || rc=1
          test -s conformance/missing-context-vectors.json || test -s packages/pca/conformance/missing-context-vectors.json || rc=1
          ruby -Ilib test/test_missing_context.rb || rc=1
          test -s conformance/policy-classes-vectors.json || test -s packages/pca/conformance/policy-classes-vectors.json || rc=1
          ruby -Ilib test/test_policy_classes.rb || rc=1
          test -s conformance/provenance-vectors.json || test -s packages/pca/conformance/provenance-vectors.json || rc=1
          ruby -Ilib test/test_provenance.rb || rc=1
          test -s conformance/sigstore-vectors.json || test -s packages/pca/conformance/sigstore-vectors.json || rc=1
          ruby -Ilib test/test_sigstore_bundle.rb || rc=1
          exit $rc
      - name: Provenance by default and undo windows (arg-provenance-vectors.json, undo-vectors.json; a missing file fails, never skips)
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        env:
          PCA_REQUIRE_PQ: ${{ matrix.os == 'ubuntu-26.04' && '1' || '0' }} # OpenSSL 3.5: the hybrid ML-DSA receipt chain must run there
        run: |
          rc=0 # every command runs; a failure fails the step at the end (bash -e would hide the rest)
          test -s conformance/arg-provenance-vectors.json || test -s packages/pca/conformance/arg-provenance-vectors.json || rc=1
          test -s conformance/undo-vectors.json || test -s packages/pca/conformance/undo-vectors.json || rc=1
          ruby -Ilib test/test_arg_provenance_vectors.rb || rc=1
          ruby -Ilib test/test_undo_vectors.rb || rc=1
          ruby -Ilib test/test_provenance_flow.rb || rc=1
          exit $rc
      - name: 0.4.1 suite
        if: ${{ !cancelled() }} # one run shows every failing step
        run: ruby -Ilib test/test_r041.rb
      - name: Mutation-kill registry
        if: ${{ !cancelled() }} # one run shows every failing step
        shell: bash
        run: |
          # four processes, each a quarter of the registry (KILL_SHARD=i/4); any failing shard fails the step
          pids=(); for i in 0 1 2 3; do KILL_SHARD=$i/4 ruby -Ilib test/run_kill.rb & pids+=($!); done
          rc=0; for p in "${pids[@]}"; do wait "$p" || rc=1; done; exit $rc
      # the mutation oracle's fresh-load probe (tools/pca-audit/ruby-mutate/oracle.rb) loads the library, attest included, in a
      # fresh ruby; it is checked on the unmutated source before any mutant, so it must hold here first
      - name: The library and attest load in a fresh ruby (the mutation probe)
        if: runner.os != 'Windows'
        run: |
          # --disable-gems as the probe, with the activated gems' lib dirs (base64 is a bundled gem from Ruby 3.4) on -I
          gems=$(ruby -rbase64 -e 'print Gem.loaded_specs.values.flat_map(&:full_require_paths).map { |d| "-I#{d}" }.join(" ")')
          ruby --disable-gems $gems -Ilib -e 'require "atlas_pca"; require "atlas_pca/attest"; exit(AtlasPca.hash_canonical({ "a" => 1 }).is_a?(String) && defined?(AtlasPca::Attest) ? 0 : 1)'
      - name: Platform number model (diagnostic, on failure)
        if: failure()
        shell: bash
        run: >
          ruby -Ilib -ratlas_pca -rrbconfig/sizeof -e 'n = 9_007_199_254_740_991; a = AtlasPca.parse_json_text("[-0, -0.0, -0e0, 9007199254740991, 9007199254740993]");
          puts({ platform: RUBY_PLATFORM, ruby: RUBY_VERSION, sizeof_long: RbConfig::SIZEOF["long"],
          fixnum_2_30: (2**30).equal?(2**30), fixnum_2_53: n.equal?(9_007_199_254_740_991),
          parsed: a.map { |x| [x.class, x, x.is_a?(Float) && x.zero? ? (1.0 / x).negative? : nil] },
          float_neg_zero: (1.0 / Float("-0e5")).negative? }.inspect)'

  # The runnable server example: a Rack app gated by AtlasPca.protect, bundled against this checkout of the gem.
  example:
    name: example server / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']
    defaults:
      run:
        working-directory: examples/rails-server
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: examples/rails-server
      - name: Smoke test (allow, replay, wrong amount, no proof, no provenance, revoked; refusals carry doc)
        if: ${{ !cancelled() }} # one run shows every failing step
        run: bundle exec ruby test/smoke_test.rb
      - name: Boots under rackup and refuses an unauthenticated request with a doc link
        if: ${{ !cancelled() }} # one run shows every failing step
        run: |
          bundle exec rackup -p 9292 -o 127.0.0.1 &
          pid=$!
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9292/refunds && break; sleep 1; done
          code=$(curl -s -o body.json -w '%{http_code}' -X POST -d '{}' http://127.0.0.1:9292/refunds)
          kill $pid
          cat body.json; echo
          test "$code" = 401
          grep -q '"doc":"https://github.com/Atlas-Authorization/pca/blob/main/docs/reference/refusals.md' body.json
