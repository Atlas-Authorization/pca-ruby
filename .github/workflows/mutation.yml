          - { shard: 255, files: 'lib/atlas_pca/facade.rb lib/atlas_pca/catalog_builtin.rb', slice: 3, of: 3 }
    steps:
      - name: Container toolchain (git, cc for libatlas_less and the FFI stub tests, gh for the baseline download)
        run: |
          # an Ubuntu mirror mid-sync ("Packages.gz File has unexpected size") failed 51 shards of run 42743763420 with apt exit 100
          for attempt in 1 2 3; do apt-get update -qq -o Acquire::Retries=5 && break; [ "$attempt" = 3 ] && exit 100; sleep $((attempt * 30)); done
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Acquire::Retries=5 --no-install-recommends git gcc make libc6-dev gh ca-certificates curl xz-utils zstd gzip openssl libyaml-0-2 libffi8 >/dev/null
          openssl version
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Every file of lib/ is in the plan
        run: diff <(find lib -name '*.rb' | sort) <(tr ' ' '\n' <<<"$PLAN_FILES" | grep . | sort)
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Every file of lib/ is in the matrix, every slice present
        run: |
          ruby -ryaml -e '
            rows = YAML.load_file(".github/workflows/mutation.yml")["jobs"].values.flat_map { |x| x.dig("strategy", "matrix", "include") || [] }
            bad = rows.group_by { |r| r["files"] }.reject { |_, g| g.map { |r| r["slice"] }.sort == (1..g[0]["of"]).to_a && g.all? { |r| r["of"] == g[0]["of"] } }.keys
            abort "::error::missing or uneven slices: #{bad}" unless bad.empty?
            files = rows.flat_map { |r| r["files"].split }.uniq.sort
            tree = Dir.glob("lib/**/*.rb").sort
            abort "::error::not mutated: #{tree - files}; not in the tree: #{files - tree}" unless files == tree
          '
      - run: gem install --no-document parser
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling (+ libatlas_less)
        run: .github/scripts/mutation-layout.sh "$CRATE"
        env:
          LESS: '1'
      - name: Reason snapshot from the unmutated source (this runner's backends)
        working-directory: ${{ env.MONO }}/sdks/${{ env.CRATE }}
        run: |
          gzip -dc test-data/reasons.tsv.gz > "$RUNNER_TEMP/reasons-committed.tsv" 2>/dev/null || : > "$RUNNER_TEMP/reasons-committed.tsv"
          ruby -Ilib test/support/corpus.rb write test-data/reasons.tsv.gz
          n="$(gzip -dc test-data/reasons.tsv.gz | diff - "$RUNNER_TEMP/reasons-committed.tsv" | grep -c '^[<>]' || true)"
          [ "$n" = 0 ] || echo "::warning::the committed test-data/reasons.tsv.gz differs from this runner's output in $n line(s): stale, or other backends. The oracle uses the runner's (regenerate: ruby -Ilib test/support/corpus.rb write test-data/reasons.tsv.gz)"
      - name: Baseline results (targeted mode)
        if: ${{ !inputs.full && needs.pool.outputs.have == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: baseline-pool
          path: ${{ runner.temp }}/base
      - name: Baseline results (point the carry at them)
        if: ${{ !inputs.full && needs.pool.outputs.have == 'true' }}
        run: |
          [ -n "$(find "$RUNNER_TEMP/base" -name '*.src.rb' -print -quit)" ] || { echo "::error::baseline pool holds no results"; exit 1; }
          echo "BASE=$RUNNER_TEMP/base" >> "$GITHUB_ENV"
          echo "targeted: seeded from the baseline pool ($(find "$RUNNER_TEMP/base" -name '*.json' | wc -l) results file(s))"
      - name: Mutate
        working-directory: ${{ env.MONO }}/tools/pca-audit/ruby-mutate
        env:
          FILES: ${{ matrix.files }}
          SLICE: ${{ matrix.slice }}
          OF: ${{ matrix.of }}
          # the oracle refuses to run on a host without ML-DSA / SLH-DSA / LESS (a PQ-less shard silently skips the PQ cases)
          MUT_REQUIRE_PQ: '1'
        run: |
          # a mutant that allocates without bound dies alone (NoMemoryError: a RUN ERROR, ledgered per mutant), not the runner
          ulimit -v 6291456
          : > "$RUNNER_TEMP/raws.tsv"
          mkdir -p "$RUNNER_TEMP/mut-results"
          n=0
          for f in $FILES; do
            n=$((n + 1)); F="../../../sdks/$CRATE/$f"; out="$RUNNER_TEMP/raw-$n.json"
            slug="${f//\//__}"
            # stderr shown (minus the parser gem's version banner): a failing listing must say why
            ruby mutate.rb "$F" --list > "$RUNNER_TEMP/list.tsv" 2> >(grep --line-buffered -v 'warning: parser\|Please see\|is loading parser' >&2)
            ids="$(awk -F'\t' -v k="$SLICE" -v m="$OF" '($1 % m) == (k - 1) { printf "%s%s", s, $1; s="," }' "$RUNNER_TEMP/list.tsv")"
            echo "$f: $(wc -l < "$RUNNER_TEMP/list.tsv") mutants, $(tr ',' '\n' <<<"$ids" | grep -c .) in slice $SLICE/$OF"
            [ -n "$ids" ] || { echo "::error::no mutants for $f"; exit 1; }
            # a SURVIVING mutant of an Intent Layer v2 file runs the whole mutation-differential corpus (~14k cases, minutes);
            # every other file skips those tests, so a hung mutant there is cut after 5 minutes
            case "$f" in lib/atlas_pca/intent_*.rb) tmo=900 ;; *) tmo=300 ;; esac
            carry=()
            if [ -n "${BASE:-}" ]; then
              prevs="$(find "$BASE" -name "$slug.json" | sort | paste -sd, -)"
              src="$(find "$BASE" -name "$slug.src.rb" -print -quit)"
              if [ -n "$prevs" ] && [ -n "$src" ]; then carry=(--carry "$prevs" --carry-src "$src")
              else echo "::notice::$f: no baseline results, full run of the slice"; fi
            fi
            ruby mutate.rb "$F" --jobs 4 --timeout "$tmo" --only "$ids" "${carry[@]}" > "$out" 2> >(grep --line-buffered -v 'warning: parser\|Please see\|is loading parser' >&2) || {
              rc=$?
              # show why: the oracle's own suites on the unmutated source
              (cd "../../../sdks/$CRATE" && ruby conformance.rb 2>&1 | tail -15; ruby -Ilib test/run_kill.rb 2>&1 | tail -15)
              exit "$rc"; }
            printf '%s\t%s\n' "$f" "$out" >> "$RUNNER_TEMP/raws.tsv"
            # the next run's baseline: this slice's results (carried ones included) + the source they were taken on
            cp "$out" "$RUNNER_TEMP/mut-results/$slug.json"; cp "$F" "$RUNNER_TEMP/mut-results/$slug.src.rb"
          done
      - name: Report
        run: |
          node -e '
            const fs = require("fs"); const counts = {}, surv = [];
            for (const row of fs.readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean)) {
              const [file, path] = row.split("\t");
              for (const m of JSON.parse(fs.readFileSync(path, "utf8"))) {
                counts[m.status] = (counts[m.status] || 0) + 1;
                if (m.status === "SURVIVED") surv.push({ crate: "ruby-pca", file, mutant: m.mutant, line: m.line_text, occurrence: m.occurrence, lineno: m.line, ...(m.fn ? { fn: m.fn } : {}) });
              }
            }
            fs.writeFileSync("counts.json", JSON.stringify(counts)); fs.writeFileSync("survivors.json", JSON.stringify(surv));
            // gate honesty: a mutant decided by a stack overflow, the memory cap, a signal or the time limit (no test answered wrong)
            // is listed here, and the merge fails on each one without a per-mutant reason in mutation-run-errors.json (BRIEF: a
            // timeout is not a kill by itself; its entry proves the MUTANT loops or allocates without bound)
            const errs = [];
            for (const row of fs.readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean)) {
              const [file, path] = row.split("\t");
              for (const m of JSON.parse(fs.readFileSync(path, "utf8")))
                if (/^(RUN_ERROR|KILLED\(timeout)/.test(String(m.status))) errs.push({ file, fn: m.fn ?? null, line: m.line_text, occurrence: m.occurrence, mutant: m.mutant, lineno: m.line, evidence: m.status });
            }
            fs.writeFileSync("run-errors-${{ matrix.shard }}.json", JSON.stringify(errs, null, 1));
            // killed mutants whose site the survivor ledger or the run-error ledger names: the dead-minion rule of the merge (an equivalent
            // entry whose mutant was KILLED this run is a notice, not a stale entry) and the racy run-error rule read them
            const sk = (e) => [e.file, e.mutant, String(e.line || "").trim(), e.occurrence ?? 1].join("\u0000");
            const named = new Set();
            for (const p of [process.env.MONO + "/tools/pca-audit/native-mutation-equivalents.json", process.env.MONO + "/sdks/ruby-pca/mutation-equivalents.part.json", process.env.MONO + "/sdks/ruby-pca/mutation-run-errors.json"]) {
              if (!fs.existsSync(p)) continue;
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              for (const e of Array.isArray(j) ? j : j.equivalents) if (!e.crate || e.crate === "ruby-pca") named.add(sk(e));
            }
            const kd = [];
            for (const row of fs.readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean)) {
              const [file, path] = row.split("\t");
              for (const m of JSON.parse(fs.readFileSync(path, "utf8")))
                if (/^KILLED/.test(String(m.status)) && !/^KILLED\(timeout/.test(String(m.status)) && named.has(sk({ file, mutant: m.mutant, line: m.line_text, occurrence: m.occurrence })))
                  kd.push({ file, fn: m.fn ?? null, mutant: m.mutant, line: m.line_text, occurrence: m.occurrence, status: m.status });
            }
            fs.writeFileSync("killed-equivalents-${{ matrix.shard }}.json", JSON.stringify(kd));
            const tmo = Object.entries(counts).filter(([k]) => k.startsWith("KILLED(timeout") || k === "RUN_ERROR(timeout)").reduce((a, [, n]) => a + n, 0);
            const dl = counts["KILLED(deadline)"] || 0, cr = counts["KILLED(crash)"] || 0;
            console.log(`run errors: ${errs.length}; timeouts: ${tmo}; killed-by-deadline: ${dl}; killed-by-crash: ${cr}`);
          ' "$RUNNER_TEMP/raws.tsv"
          node .github/scripts/mutation-shard-report.mjs --crate="$CRATE" --shard=${{ matrix.shard }} --of="$SHARDS" --tool=ruby-mutate \
            --counts=counts.json --survivors=survivors.json --out=shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.json
            run-errors-${{ matrix.shard }}.json
            killed-equivalents-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mut-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/mut-results/
          retention-days: 30

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship checker + ledger
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: shard-*
      - name: Merge shards and check the ledger
        # a ledgered equivalent that a test KILLED this run is a notice (nondeterministic killer), not a stale entry: stale-killed.mjs
        run: |
          rc=0
          node .github/scripts/mutation-merge.mjs --crate="$CRATE" --shards="$SHARDS" --reports=reports \
            --checker="$MONO/tools/pca-audit" --src="$GITHUB_WORKSPACE" > "$RUNNER_TEMP/merge.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/merge.log"
          node .github/scripts/stale-killed.mjs "$RUNNER_TEMP/merge.log" reports "$rc"
      # gate honesty (BRIEF): a RUN_ERROR mutant (stack overflow, NoMemoryError under ulimit -v, a signal) was decided by no test.
      # Each must be in mutation-run-errors.json with a per-mutant reason proving the mutant caused it; unlisted or stale fails.
      - name: Run errors are each proven mutant-caused
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const got = []; let shards = 0;
            const walk = (d) => { for (const e of fs.readdirSync(d, { withFileTypes: true })) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (/^run-errors-\d+\.json$/.test(e.name)) { shards++; got.push(...JSON.parse(fs.readFileSync(p, "utf8"))); } } };
            walk("reports");
            const want = Number(process.env.SHARDS);
            if (shards !== want) { console.error(`::error::run-error lists from ${shards}/${want} shards (a missing list is a failure)`); process.exit(1); }
            const led = JSON.parse(fs.readFileSync(process.env.MONO + "/sdks/ruby-pca/mutation-run-errors.json", "utf8"));
            const key = (m) => [m.file, m.fn ?? "", m.line, m.occurrence ?? 1, m.mutant].join(" | ");
            const killedSites = new Set();
            const kw = (d) => { for (const e of fs.readdirSync(d, { withFileTypes: true })) { const p = path.join(d, e.name); if (e.isDirectory()) kw(p); else if (/^killed-equivalents-\d+\.json$/.test(e.name)) for (const k of JSON.parse(fs.readFileSync(p, "utf8"))) killedSites.add([k.file, k.mutant, String(k.line || "").trim(), k.occurrence ?? 1].join("\u0000")); } };
            kw("reports");
            const have = new Map(); for (const m of got) have.set(key(m), (have.get(key(m)) || 0) + 1);
            let bad = 0; const used = new Set();
            for (const e of led) {
              if (!e.reason) { console.error("::error::run-error ledger entry without a reason: " + key(e)); bad++; }
              // a `racy: true` entry (the mutant may die as an ordinary kill in a run where its resource blow-up loses the race) may
              // match 0 only if its mutant was generated AND plainly killed in this run (killed-equivalents-<k>.json)
              const plainlyKilled = killedSites.has([e.file, e.mutant, String(e.line || "").trim(), e.occurrence ?? 1].join("\u0000"));
              if (!have.has(key(e)) && !(e.racy === true && plainlyKilled)) { console.error("::error::STALE run-error ledger entry (not a run error in this run" + (e.racy === true ? ", and not plainly killed either" : "") + "): " + key(e)); bad++; }
              used.add(key(e));
            }
            for (const m of got) if (!used.has(key(m))) { console.error(`::error::UNPROVEN run error (${m.evidence}), no test decided it: ${key(m)}`); bad++; }
            console.log(`${got.length} run-error mutant(s) over ${shards} shards, ${led.length} ledger entries, ${bad} problem(s)`);
            process.exit(bad ? 1 : 0);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survivors-merged
          path: reports/survivors-merged.json
          if-no-files-found: ignore
