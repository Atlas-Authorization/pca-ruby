          - { shard: 104, files: 'lib/atlas_pca/assurance.rb lib/atlas_pca/stepup.rb', slice: 1, of: 1 }
          - { shard: 105, files: 'lib/atlas_pca/store_conformance.rb lib/atlas_pca/decision.rb', slice: 1, of: 1 }
