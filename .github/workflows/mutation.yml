name: Mutation

# Mutation testing of the verifier library, every file of lib/ (atlas_pca.rb and the lib/atlas_pca/* extensions it
# require_relative's), with the AST mutator in the flagship (tools/pca-audit/ruby-mutate; oracle = the kill tests +
# core/adversarial corpus + every conformance table + the reason snapshot; a mutant of an extension file is evaluated with
# the library and every other extension re-loaded). 256 shards: the large files are split by mutant id (slice k of m = ids
# with id % m == k - 1), the three small files share one shard; the plan check fails when lib/ gains a file the matrix does
# not list. The merge job checks the survivors against the equivalent-mutant ledger: it passes when every survivor is a
# ledgered equivalent and no ledger entry is stale. Runs on demand and on ci/** branches (the release-candidate check),
# never on main pushes. ubuntu-26.04 + setup-ruby: the openssl extension gets ML-DSA from OpenSSL 3.5 (the CI's green
# configuration); libatlas_less is built for the LESS suites.
# Shard 25/62 of run 39706440492 (intent_v2.rb slice 21/36) ran to the 300-minute limit with no result: the reaper blocked on a
# mutant child that its own timer thread could not kill (a C call that never yields the interpreter lock), and the stderr
# filter (grep without --line-buffered) hid all progress. mutate.rb now kills a child from the PARENT (process group, --timeout
# + 20s), the filter is line-buffered, and intent_v2.rb is cut into 72 slices (~146 mutants each; a full slice measured ~45 min
# on a loaded box). agent.rb (one shard of 1133 mutants) ran to the 300-minute limit in run 41710479412 (shards 115 + 120-122
# now, slices of 4). Carry-forward is keyed by mutant identity, not id or slice, so the next targeted run maps any baseline.
# The reason snapshot is written on the runner from the UNMUTATED source before mutating (it is a characterization oracle:
# "same output as the original, on this host's backends"); a committed copy that differs only gets a warning. A stale
# committed snapshot (and a hard-coded suite list) made every shard's baseline fail in run 38330627498.
#
# TARGETED mode (the default whenever a baseline exists; the pca-java/pca-kotlin scheme): every shard uploads
# mut-results-<k> (per file: every mutant's result, carried ones included, and the source it mutated) and the next run
# feeds the baseline run's results back (mutate.rb --carry), re-running ONLY what can have changed: mutants the baseline
# never saw, its non-kills (new kill tests may kill them), and every mutant of a def containing a changed line (a change
# outside every def re-runs the file). Every other result is carried forward, so each shard still reports its COMPLETE
# mutant set and the merge checks the ledger over the full picture. Baseline = the input `baseline_run`, else the newest
# earlier run of this workflow on the same branch with results; none (or `full: true`) = a full run, which seeds the next.
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: 'run id whose mut-results-<k> artifacts seed a targeted run (default: newest earlier run on this branch)'
        required: false
        default: ''
      full:
        description: 'ignore any baseline results: mutate everything'
        type: boolean
        default: false
  push:
    branches: ['ci/**']

permissions:
  contents: read
  actions: read

concurrency:
  # a push supersedes an earlier push run; a dispatched (queue) run is never killed by a later push to the branch
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CRATE: ruby-pca
  SHARDS: '255'
  # every file of lib/, as listed in the matrix below (checked by the shard step). The attestation verifiers (lib/atlas_pca/attest*,
  # opt-in: not required by atlas_pca.rb) are mutated too: the attest kill tests require them, so the oracle re-evaluates them
  # per mutant (oracle.rb @opt_in). They were left out of the plan until run 41710479412 (4.7k lines never mutated).
  PLAN_FILES: >-
    lib/atlas_pca.rb lib/atlas_pca/intent_v2.rb lib/atlas_pca/intent_wb.rb lib/atlas_pca/predicates.rb
    lib/atlas_pca/safe_regex.rb lib/atlas_pca/rack_middleware.rb lib/atlas_pca/intent_layers.rb lib/atlas_pca/less_ffi.rb
    lib/atlas_pca/authorize.rb lib/atlas_pca/operations.rb lib/atlas_pca/atomic_kv.rb lib/atlas_pca/plan_lifecycle.rb
    lib/atlas_pca/revocation_staleness.rb lib/atlas_pca/assurance.rb lib/atlas_pca/stepup.rb
    lib/atlas_pca/store_conformance.rb lib/atlas_pca/decision.rb lib/atlas_pca/mesh.rb lib/atlas_pca/escalation.rb
    lib/atlas_pca/passport.rb lib/atlas_pca/optimistic.rb lib/atlas_pca/ledger.rb lib/atlas_pca/intent_history.rb
    lib/atlas_pca/agent.rb lib/atlas_pca/actions.rb lib/atlas_pca/actions_registry.rb lib/atlas_pca/caveat_lang.rb
    lib/atlas_pca/forbid_certificate.rb lib/atlas_pca/policy_link.rb lib/atlas_pca/fresh_at.rb lib/atlas_pca/k3.rb
    lib/atlas_pca/pca_grant.rb lib/atlas_pca/blueprint.rb lib/atlas_pca/a2a.rb lib/atlas_pca/workflow.rb
    lib/atlas_pca/readside.rb lib/atlas_pca/read_vault.rb lib/atlas_pca/lease.rb lib/atlas_pca/obligations.rb
    lib/atlas_pca/break_glass.rb lib/atlas_pca/missing_context.rb lib/atlas_pca/policy_classes.rb lib/atlas_pca/k4.rb
    lib/atlas_pca/approval.rb lib/atlas_pca/protect.rb lib/atlas_pca/provenance_gate.rb lib/atlas_pca/refusal_help.rb
    lib/atlas_pca/runtime_claim.rb lib/atlas_pca/sigstore_bundle.rb lib/atlas_pca/risk.rb lib/atlas_pca/taint.rb lib/atlas_pca/beacons.rb lib/atlas_pca/prohibitions.rb lib/atlas_pca/contracts.rb
    lib/atlas_pca/signers_more.rb lib/atlas_pca/facade.rb lib/atlas_pca/catalog_builtin.rb
    lib/atlas_pca/arg_provenance.rb lib/atlas_pca/undo.rb
    lib/atlas_pca/attest.rb lib/atlas_pca/attest/common.rb lib/atlas_pca/attest/der.rb lib/atlas_pca/attest/cert.rb lib/atlas_pca/attest/amd.rb lib/atlas_pca/attest/azure.rb lib/atlas_pca/attest/gcp.rb lib/atlas_pca/attest/intel.rb lib/atlas_pca/attest/ocsp.rb lib/atlas_pca/attest/xml.rb lib/atlas_pca/attest/nvidia.rb

jobs:
  # ONE job downloads the baseline run's results (with retries) and hands them to every shard as a single artifact: ~260 artifacts
  # downloaded by each of 64 concurrent shards were rate-limited (34 of 256 shards of run 42714273279 still had none after 6
  # attempts and silently ran a full slice). A baseline_run that cannot be fetched fails the run (loud) instead of degrading.
  pool:
    name: baseline pool
    if: ${{ !inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      have: ${{ steps.pool.outputs.have }}
    steps:
      - id: pool
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ inputs.baseline_run }}
        run: |
          ids="$BASELINE"
          if [ -z "$ids" ]; then
            ids="$(gh run list -R "$GITHUB_REPOSITORY" --workflow mutation.yml --branch "$GITHUB_REF_NAME" --limit 20 \
                     --json databaseId -q '.[].databaseId' | grep -vx "$GITHUB_RUN_ID" || true)"
          fi
          for id in $ids; do
            for attempt in 1 2 3 4 5 6; do
              rm -rf base
              if gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'mut-results-*' -D base 2>dl.err \
                 && [ -n "$(find base -name '*.src.rb' -print -quit)" ]; then
                echo "have=true" >> "$GITHUB_OUTPUT"
                echo "baseline pool from run $id: $(find base -name '*.json' | wc -l) results file(s), attempt $attempt"; exit 0
              fi
              echo "::warning::baseline download from run $id, attempt $attempt/6 failed: $(tail -c 300 dl.err | tr '\n' ' ')"
              sleep $((attempt * 20))
            done
            [ -n "$BASELINE" ] && { echo "::error::baseline run $BASELINE could not be fetched"; exit 1; }
          done
          echo "have=false" >> "$GITHUB_OUTPUT"
          echo "::notice::no baseline results found, full run (seeds the next run)"
      - uses: actions/upload-artifact@v4
        if: ${{ steps.pool.outputs.have == 'true' }}
        with:
          name: baseline-pool
          path: base/
          retention-days: 2
          compression-level: 6

  shard:
    needs: pool
    if: ${{ !cancelled() && needs.pool.result != 'failure' }}
    name: shard ${{ matrix.shard }}/255 (${{ matrix.files }} ${{ matrix.slice }}/${{ matrix.of }})
    # the ubuntu-26.04 userland (OpenSSL 3.5: ML-DSA / SLH-DSA) in a container on the general runner pool: the
    # ubuntu-26.04 hosted image has a much smaller concurrency pool (~14 jobs where the plan allows 60)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
    defaults:
      run:
        shell: bash
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 256 # Enterprise plan: 500 concurrent jobs org-wide; GitHub queues anything above that
      matrix:
        include:
          - { shard: 1, files: lib/atlas_pca.rb, slice: 1, of: 6 }
          - { shard: 2, files: lib/atlas_pca.rb, slice: 2, of: 6 }
          - { shard: 3, files: lib/atlas_pca.rb, slice: 3, of: 6 }
          - { shard: 4, files: lib/atlas_pca.rb, slice: 4, of: 6 }
          - { shard: 5, files: lib/atlas_pca.rb, slice: 5, of: 6 }
          - { shard: 6, files: lib/atlas_pca.rb, slice: 6, of: 6 }
          - { shard: 7, files: lib/atlas_pca/intent_v2.rb, slice: 1, of: 56 }
