          - { shard: 463, files: lib/atlas_pca/store_conformance_model.rb, slice: 1, of: 2 }
          - { shard: 464, files: lib/atlas_pca/store_conformance_model.rb, slice: 2, of: 2 }
          - { shard: 465, files: lib/atlas_pca/store_conformance_pca_state.rb, slice: 1, of: 2 }
          - { shard: 466, files: lib/atlas_pca/store_conformance_pca_state.rb, slice: 2, of: 2 }
          - { shard: 467, files: lib/atlas_pca/store_conformance_profiles.rb, slice: 1, of: 5 }
          - { shard: 468, files: lib/atlas_pca/store_conformance_profiles.rb, slice: 2, of: 5 }
          - { shard: 469, files: lib/atlas_pca/store_conformance_profiles.rb, slice: 3, of: 5 }
          - { shard: 470, files: lib/atlas_pca/store_conformance_profiles.rb, slice: 4, of: 5 }
          - { shard: 471, files: lib/atlas_pca/store_conformance_profiles.rb, slice: 5, of: 5 }
          - { shard: 472, files: lib/atlas_pca/store_conformance_runner.rb, slice: 1, of: 1 }
          - { shard: 473, files: lib/atlas_pca/store_conformance_worker.rb, slice: 1, of: 1 }
          - { shard: 474, files: lib/atlas_pca/testing.rb, slice: 1, of: 1 }
          - { shard: 475, files: lib/atlas_pca/txn_tokens.rb, slice: 1, of: 1 }
          - { shard: 476, files: lib/atlas_pca/vc.rb, slice: 1, of: 2 }
          - { shard: 477, files: lib/atlas_pca/vc.rb, slice: 2, of: 2 }
          - { shard: 478, files: lib/atlas_pca/vdf.rb, slice: 1, of: 2 }
          - { shard: 479, files: lib/atlas_pca/vdf.rb, slice: 2, of: 2 }
          - { shard: 480, files: lib/atlas_pca/wallet.rb, slice: 1, of: 3 }
          - { shard: 481, files: lib/atlas_pca/wallet.rb, slice: 2, of: 3 }
          - { shard: 482, files: lib/atlas_pca/wallet.rb, slice: 3, of: 3 }
          - { shard: 483, files: lib/atlas_pca/wallet_card.rb, slice: 1, of: 2 }
          - { shard: 484, files: lib/atlas_pca/wallet_card.rb, slice: 2, of: 2 }
          - { shard: 485, files: lib/atlas_pca/wallet_channel.rb, slice: 1, of: 2 }
          - { shard: 486, files: lib/atlas_pca/wallet_channel.rb, slice: 2, of: 2 }
          - { shard: 487, files: lib/atlas_pca/wallet_delivery.rb, slice: 1, of: 1 }
          - { shard: 488, files: lib/atlas_pca/wallet_handlers.rb, slice: 1, of: 1 }
          - { shard: 489, files: lib/atlas_pca/wallet_population.rb, slice: 1, of: 1 }
          - { shard: 490, files: lib/atlas_pca/wallet_pricing.rb, slice: 1, of: 1 }
          - { shard: 491, files: lib/atlas_pca/webauthn.rb, slice: 1, of: 2 }
          - { shard: 492, files: lib/atlas_pca/webauthn.rb, slice: 2, of: 2 }
          - { shard: 493, files: lib/atlas_pca/webbotauth.rb, slice: 1, of: 4 }
          - { shard: 494, files: lib/atlas_pca/webbotauth.rb, slice: 2, of: 4 }
          - { shard: 495, files: lib/atlas_pca/webbotauth.rb, slice: 3, of: 4 }
          - { shard: 496, files: lib/atlas_pca/webbotauth.rb, slice: 4, of: 4 }
          - { shard: 497, files: lib/atlas_pca/whatwg_url.rb, slice: 1, of: 1 }
          - { shard: 498, files: lib/atlas_pca/goal_bench.rb, slice: 1, of: 2 }
          - { shard: 499, files: lib/atlas_pca/goal_bench.rb, slice: 2, of: 2 }
          - { shard: 500, files: lib/atlas_pca/approval_channels.rb, slice: 1, of: 1 }
    steps:
      - name: Container toolchain (git, cc for libatlas_less and the FFI stub tests, gh for the baseline download)
        run: |
          # an Ubuntu mirror mid-sync ("Packages.gz File has unexpected size") failed 51 shards of run 42743763420 with apt exit 100
          for attempt in 1 2 3; do apt-get update -qq -o Acquire::Retries=5 && break; [ "$attempt" = 3 ] && exit 100; sleep $((attempt * 30)); done
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Acquire::Retries=5 --no-install-recommends git gcc make libc6-dev gh ca-certificates curl xz-utils zstd gzip openssl libyaml-0-2 libffi8 >/dev/null
          openssl version
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Every file of lib/ is in the plan
        run: diff <(find lib -name '*.rb' | sort) <(tr ' ' '\n' <<<"$PLAN_FILES" | grep . | sort)
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Every file of lib/ is in the matrix, every slice present
        run: |
          ruby -ryaml -e '
            rows = YAML.load_file(".github/workflows/mutation.yml")["jobs"].values.flat_map { |x| x.dig("strategy", "matrix", "include") || [] }
            bad = rows.group_by { |r| r["files"] }.reject { |_, g| g.map { |r| r["slice"] }.sort == (1..g[0]["of"]).to_a && g.all? { |r| r["of"] == g[0]["of"] } }.keys
            abort "::error::missing or uneven slices: #{bad}" unless bad.empty?
            files = rows.flat_map { |r| r["files"].split }.uniq.sort
            tree = Dir.glob("lib/**/*.rb").sort
            abort "::error::not mutated: #{tree - files}; not in the tree: #{files - tree}" unless files == tree
          '
      - run: gem install --no-document parser
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling (+ libatlas_less)
        run: .github/scripts/mutation-layout.sh "$CRATE"
        env:
          LESS: '1'
      - name: Module toolchain (C++ runtime and headers for the gem builds)
        if: ${{ matrix.module }}
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Acquire::Retries=5 --no-install-recommends cmake g++ pkg-config libclang-dev libffi-dev zlib1g-dev >/dev/null
      - name: Rust toolchain (the wasmtime gem builds its extension)
        if: ${{ matrix.module == 'sandbox-wasm' }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: ffi (module shards)
        if: ${{ matrix.module }}
        run: |
          gem install ffi --no-document
          # the oracle's fresh-ruby load probe runs with --disable-gems: the ffi gem is reached through RUBYLIB
          echo "RUBYLIB=$(ruby -e 'puts Gem::Specification.find_by_name("ffi").full_require_paths.join(":")')" >> "$GITHUB_ENV"
      # the native libraries are built ONCE per module by the natives job (same container image), not once per shard
      - name: Native libraries built by the natives job
        if: ${{ matrix.module }}
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.module }}
          path: ${{ runner.temp }}/native
      - name: Native library environment
        if: ${{ matrix.module }}
        run: |
          n="$RUNNER_TEMP/native"
          case "${{ matrix.module }}" in
            pairing) echo "PCA_BLST_LIB=$n/libblst.so" >> "$GITHUB_ENV" ;;
            fhe) { echo "ATLAS_PCA_LIBSEALC=$n/libsealc.so"; echo "PCA_FHE_SEAL_CORPUS=$n/fhe-seal.json.gz"; echo "PCA_FHE_SEAL_REQUIRED=1"; } >> "$GITHUB_ENV" ;;
            lwe-ot) { echo "ATLAS_PCA_LIBLWEOT=$n/liblweot.so"; echo "ATLAS_PCA_LIBLWEOT_REQUIRED=1"; } >> "$GITHUB_ENV" ;;
            fndsa) { echo "ATLAS_PCA_LIBFNDSA=$n/libfndsa.so"; echo "ATLAS_PCA_LIBFNDSA_REQUIRED=1"; } >> "$GITHUB_ENV" ;;
            zk) { echo "ATLAS_PCA_LIBPCAZK=$n/libpcazk.so"; echo "ATLAS_PCA_LIBPCAZK_REQUIRED=1"; } >> "$GITHUB_ENV" ;;
            ada) { echo "ATLAS_PCA_LIBADA=$n/libada.so"; echo "PCA_ADA_REQUIRED=1"; } >> "$GITHUB_ENV" ;;
            sandbox-wasm)
              gem install wasmtime minitest --no-document
              chmod +x "$n/pca-wasmtime-host"
              { echo "PCA_WASMTIME_HOST_BIN=$n/pca-wasmtime-host"; echo "PCA_WASMTIME_HOST_SHA256=$(cat "$n/host.sha256")"; } >> "$GITHUB_ENV" ;;
          esac
      - name: Module replay tests as kill entries
        if: ${{ matrix.module }}
        run: |
          case "${{ matrix.module }}" in
            pairing)      t="test/test_ref_aggsig.rb test/test_ref_bbs.rb test/test_bbs_kat.rb test/test_ref_abe.rb test/test_fame_pyecc.rb" ;;
            fhe)          t="test/test_fhe_seal.rb" ;;
            lwe-ot)       t="test/test_ref_mpc_endemic.rb" ;;
            fndsa)        t="test/test_ref_fndsa.rb test/test_fndsa_native.rb test/test_fndsa_core.rb test/test_fndsa_e2e.rb" ;;
            zk)           t="test/test_zk_native.rb" ;;
            ada)          t="test/test_ref_entropy.rb" ;;
            sandbox-wasm) t="test/test_ref_sandbox_wasm.rb" ;;
          esac
          cp .github/scripts/module-kill.rb "$MONO/sdks/$CRATE/test/kill/zz_module_kill.rb"
          echo "MUT_MODULE_TESTS=$t" >> "$GITHUB_ENV"
      - name: RSA DPoP oracle corpus (generated, never committed)
        run: .github/scripts/dpop-rsa-corpus.sh "$MONO/sdks/ruby-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Private-key oracle cases (generated, never committed)
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/ruby-pca/test-data" oprf:oprf core-frost-java:core-frost-java mpc-ot:mpc-ot attest-eat:attest-eat abe:abe frost-dkg:frost-dkg
      - name: Reason snapshot from the unmutated source (this runner's backends)
        working-directory: ${{ env.MONO }}/sdks/${{ env.CRATE }}
        run: |
          gzip -dc test-data/reasons.tsv.gz > "$RUNNER_TEMP/reasons-committed.tsv" 2>/dev/null || : > "$RUNNER_TEMP/reasons-committed.tsv"
          ruby -Ilib test/support/corpus.rb write test-data/reasons.tsv.gz
          n="$(gzip -dc test-data/reasons.tsv.gz | diff - "$RUNNER_TEMP/reasons-committed.tsv" | grep -c '^[<>]' || true)"
          [ "$n" = 0 ] || echo "::warning::the committed test-data/reasons.tsv.gz differs from this runner's output in $n line(s): stale, or other backends. The oracle uses the runner's (regenerate: ruby -Ilib test/support/corpus.rb write test-data/reasons.tsv.gz)"
      - name: Baseline results (targeted mode)
        if: ${{ !(inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]')) && needs.pool.outputs.have == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: baseline-pool
          path: ${{ runner.temp }}/base
      - name: Baseline results (point the carry at them)
        if: ${{ !(inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]')) && needs.pool.outputs.have == 'true' }}
        run: |
          [ -n "$(find "$RUNNER_TEMP/base" -name '*.src.rb' -print -quit)" ] || { echo "::error::baseline pool holds no results"; exit 1; }
          echo "BASE=$RUNNER_TEMP/base" >> "$GITHUB_ENV"
          echo "targeted: seeded from the baseline pool ($(find "$RUNNER_TEMP/base" -name '*.json' | wc -l) results file(s))"
      # A survivor of the baseline run stands when this run's oracle is byte-identical to the one it ran against: every tracked file of the
      # checkout (tests, kill tests, lib, corpus inputs) plus the shared corpus and the mutator, ledgers aside. Any change at all (a new kill
      # test may kill it) and the survivors run again; kills carry as before.
      - name: Oracle fingerprint (for carrying survivors)
        run: |
          : > "$RUNNER_TEMP/no-excludes.txt"
          node "$MONO/tools/pca-audit/mut-carry/snapshot.mjs" make --root="$GITHUB_WORKSPACE" --exclude-list="$RUNNER_TEMP/no-excludes.txt" \
            --corpus-root="$MONO" --out="$RUNNER_TEMP/fp-snap" --cfg="ruby-mutate $(ruby -v) $(openssl version)" \
            --tool-files="$MONO/tools/pca-audit/ruby-mutate/mutate.rb,$MONO/tools/pca-audit/ruby-mutate/oracle.rb"
          fp="$(node -e '
            const fs = require("fs"), path = require("path"), h = require("crypto").createHash("sha256");
            const L = /(^|\/)(mutation-run-errors|mutation-equivalents|[^/]*mutants-ledger)[^/]*\.json$/;
            const walk = (d, b = d) => fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => e.isDirectory() ? walk(path.join(d, e.name), b) : [path.relative(b, path.join(d, e.name))]);
            const root = process.argv[1]; h.update(JSON.parse(fs.readFileSync(root + "/meta.json", "utf8")).tool_hash);
            for (const r of walk(root).sort()) { if (r === "meta.json" || L.test(r)) continue; h.update(r + "\0"); h.update(fs.readFileSync(path.join(root, r))); }
            console.log(h.digest("hex"));
          ' "$RUNNER_TEMP/fp-snap")"
          echo "ORACLE_FP=$fp" >> "$GITHUB_ENV"
          echo "oracle fingerprint $fp"
      - name: Mutate
        working-directory: ${{ env.MONO }}/tools/pca-audit/ruby-mutate
        env:
          FILES: ${{ matrix.files }}
          SLICE: ${{ matrix.slice }}
          OF: ${{ matrix.of }}
          # the oracle refuses to run on a host without ML-DSA / SLH-DSA / LESS (a PQ-less shard silently skips the PQ cases)
          MUT_REQUIRE_PQ: '1'
          # module shards: the module's replay tests (module-kill.rb) run before the rest of the registry
          MUT_FIRST: ${{ matrix.module && 'mod_' || '' }}
        run: |
          # a mutant that allocates without bound dies alone (NoMemoryError: a RUN ERROR, ledgered per mutant), not the runner
          ulimit -v 6291456
          : > "$RUNNER_TEMP/raws.tsv"
          mkdir -p "$RUNNER_TEMP/mut-results"
          n=0
          for f in $FILES; do
            n=$((n + 1)); F="../../../sdks/$CRATE/$f"; out="$RUNNER_TEMP/raw-$n.json"
            slug="${f//\//__}"
            # stderr shown (minus the parser gem's version banner): a failing listing must say why
            ruby mutate.rb "$F" --list > "$RUNNER_TEMP/list.tsv" 2> >(grep --line-buffered -v 'warning: parser\|Please see\|is loading parser' >&2)
            ids="$(awk -F'\t' -v k="$SLICE" -v m="$OF" '($1 % m) == (k - 1) { printf "%s%s", s, $1; s="," }' "$RUNNER_TEMP/list.tsv")"
            echo "$f: $(wc -l < "$RUNNER_TEMP/list.tsv") mutants, $(tr ',' '\n' <<<"$ids" | grep -c .) in slice $SLICE/$OF"
            if [ -z "$ids" ]; then
              # a file of data only (no def: constants and heredocs) has nothing to mutate; code with no mutant is a mutator failure
              if [ ! -s "$RUNNER_TEMP/list.tsv" ] && ! grep -qE '^\s*def ' "$F"; then echo "::notice::$f has no code to mutate (data only)"; continue; fi
              echo "::error::no mutants for $f"; exit 1
            fi
            # a SURVIVING mutant of an Intent Layer v2 file runs the whole mutation-differential corpus (~14k cases, minutes);
            # every other file skips those tests, so a hung mutant there is cut after 5 minutes
            case "$f" in lib/atlas_pca/intent_*.rb) tmo=900 ;; *) tmo=300 ;; esac
            carry=()
            if [ -n "${BASE:-}" ]; then
              prevs="$(find "$BASE" -name "$slug.json" | sort | paste -sd, -)"
              src="$(find "$BASE" -name "$slug.src.rb" -print -quit)"
              if [ -n "$prevs" ] && [ -n "$src" ]; then
                carry=(--carry "$prevs" --carry-src "$src")
                # same oracle as the baseline's: its survivors stand too
                bfp="$(find "$BASE" -name "$slug.fp" -print -quit)"
                if [ -n "$bfp" ] && [ "$(cat "$bfp")" = "$ORACLE_FP" ]; then carry+=(--carry-survived); echo "$f: oracle identical to the baseline's, survivors carried"; fi
              else echo "::notice::$f: no baseline results, full run of the slice"; fi
            fi
            ruby mutate.rb "$F" --jobs 4 --timeout "$tmo" --only "$ids" "${carry[@]}" > "$out" 2> >(grep --line-buffered -v 'warning: parser\|Please see\|is loading parser' >&2) || {
              rc=$?
              # show why: the oracle's own suites on the unmutated source
              (cd "../../../sdks/$CRATE" && ruby conformance.rb 2>&1 | tail -15; ruby -Ilib test/run_kill.rb 2>&1 | tail -15)
              exit "$rc"; }
            printf '%s\t%s\n' "$f" "$out" >> "$RUNNER_TEMP/raws.tsv"
            # the next run's baseline: this slice's results (carried ones included) + the source they were taken on
            cp "$out" "$RUNNER_TEMP/mut-results/$slug.json"; cp "$F" "$RUNNER_TEMP/mut-results/$slug.src.rb"; printf '%s' "$ORACLE_FP" > "$RUNNER_TEMP/mut-results/$slug.fp"
          done
      - name: Report
        run: |
          node -e '
            const fs = require("fs"); const counts = {}, surv = [];
            for (const row of fs.readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean)) {
              const [file, path] = row.split("\t");
              for (const m of JSON.parse(fs.readFileSync(path, "utf8"))) {
                counts[m.status] = (counts[m.status] || 0) + 1;
                if (m.status === "SURVIVED") surv.push({ crate: "ruby-pca", file, mutant: m.mutant, line: m.line_text, occurrence: m.occurrence, lineno: m.line, ...(m.fn ? { fn: m.fn } : {}) });
              }
            }
            fs.writeFileSync("counts.json", JSON.stringify(counts)); fs.writeFileSync("survivors.json", JSON.stringify(surv));
            // gate honesty: a mutant decided by a stack overflow, the memory cap, a signal or the time limit (no test answered wrong)
            // is listed here, and the merge fails on each one without a per-mutant reason in mutation-run-errors.json (BRIEF: a
            // timeout is not a kill by itself; its entry proves the MUTANT loops or allocates without bound)
            const errs = [];
            for (const row of fs.readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean)) {
              const [file, path] = row.split("\t");
              for (const m of JSON.parse(fs.readFileSync(path, "utf8")))
                if (/^(RUN_ERROR|KILLED\(timeout)/.test(String(m.status))) errs.push({ file, fn: m.fn ?? null, line: m.line_text, occurrence: m.occurrence, mutant: m.mutant, lineno: m.line, evidence: m.status });
            }
            fs.writeFileSync("run-errors-${{ matrix.shard }}.json", JSON.stringify(errs, null, 1));
            // killed mutants whose site the survivor ledger or the run-error ledger names: the dead-minion rule of the merge (an equivalent
            // entry whose mutant was KILLED this run is a notice, not a stale entry) and the racy run-error rule read them
            const sk = (e) => [e.file, e.mutant, String(e.line || "").trim(), e.occurrence ?? 1].join("\u0000");
            const named = new Set();
            for (const p of [process.env.MONO + "/tools/pca-audit/native-mutation-equivalents.json", process.env.MONO + "/sdks/ruby-pca/mutation-equivalents.part.json", process.env.MONO + "/sdks/ruby-pca/mutation-run-errors.json"]) {
              if (!fs.existsSync(p)) continue;
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              for (const e of Array.isArray(j) ? j : j.equivalents) if (!e.crate || e.crate === "ruby-pca") named.add(sk(e));
            }
            const kd = [];
            for (const row of fs.readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean)) {
              const [file, path] = row.split("\t");
              for (const m of JSON.parse(fs.readFileSync(path, "utf8")))
                if (/^KILLED/.test(String(m.status)) && !/^KILLED\(timeout/.test(String(m.status)) && named.has(sk({ file, mutant: m.mutant, line: m.line_text, occurrence: m.occurrence })))
                  kd.push({ file, fn: m.fn ?? null, mutant: m.mutant, line: m.line_text, occurrence: m.occurrence, status: m.status });
            }
            fs.writeFileSync("killed-equivalents-${{ matrix.shard }}.json", JSON.stringify(kd));
            const tmo = Object.entries(counts).filter(([k]) => k.startsWith("KILLED(timeout") || k === "RUN_ERROR(timeout)").reduce((a, [, n]) => a + n, 0);
            const dl = counts["KILLED(deadline)"] || 0, cr = counts["KILLED(crash)"] || 0;
            console.log(`run errors: ${errs.length}; timeouts: ${tmo}; killed-by-deadline: ${dl}; killed-by-crash: ${cr}`);
          ' "$RUNNER_TEMP/raws.tsv"
          node .github/scripts/mutation-shard-report.mjs --crate="$CRATE" --shard=${{ matrix.shard }} --of="$SHARDS" --tool=ruby-mutate \
            --counts=counts.json --survivors=survivors.json --out=shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.json
            run-errors-${{ matrix.shard }}.json
            killed-equivalents-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mut-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/mut-results/
          retention-days: 30

  shard-3:
    needs: [reuse, pool, natives]
    if: ${{ needs.reuse.outputs.skip != 'true' && (!cancelled() && needs.pool.result != 'failure') }}
    name: shard ${{ matrix.shard }}/605 (${{ matrix.files }} ${{ matrix.slice }}/${{ matrix.of }})
    # the ubuntu-26.04 userland (OpenSSL 3.5: ML-DSA / SLH-DSA) in a container on the general runner pool: the
    # ubuntu-26.04 hosted image has a much smaller concurrency pool (~14 jobs where the plan allows 60)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
    defaults:
      run:
        shell: bash
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 256 # Enterprise plan: 500 concurrent jobs org-wide; GitHub queues anything above that
      matrix:
        include:
          - { shard: 501, files: lib/atlas_pca/hash_suite.rb, slice: 1, of: 1 }
          - { shard: 502, files: lib/atlas_pca/pq.rb, slice: 1, of: 1 }
          - { shard: 503, files: lib/atlas_pca/server_guard.rb, slice: 1, of: 1 }
          - { shard: 504, files: lib/atlas_pca/chain_compact.rb, slice: 1, of: 1 }
          - { shard: 505, files: lib/atlas_pca/policy_templates.rb, slice: 1, of: 1 }
          - { shard: 506, files: lib/atlas_pca/discovery.rb, slice: 1, of: 1 }
          - { shard: 507, files: lib/atlas_pca/reference_names.rb, slice: 1, of: 1 }
          - { shard: 508, files: lib/atlas_pca/durable_state.rb, slice: 1, of: 3 }
          - { shard: 509, files: lib/atlas_pca/durable_state.rb, slice: 2, of: 3 }
          - { shard: 510, files: lib/atlas_pca/durable_state.rb, slice: 3, of: 3 }
          - { shard: 511, files: lib/atlas_pca/undo_stores.rb, slice: 1, of: 1 }
          - { shard: 512, files: lib/atlas_pca/wire_checks.rb, slice: 1, of: 1 }
          - { shard: 513, files: lib/atlas_pca/approvals.rb, slice: 1, of: 1 }
