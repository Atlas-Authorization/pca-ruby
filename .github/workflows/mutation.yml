jobs:
  reuse:
    name: reuse check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
      hash: ${{ steps.reuse.outputs.hash }}
      source: ${{ steps.reuse.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      # input-hash reuse (ci-reuse.mjs): when an earlier run recorded the same input hash, every other job of this run is skipped.
      # continue-on-error: a failing check can only mean "no reuse"; FORCE_FULL / force_full / [force-full] bypass it.
      - id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.force_full || inputs.full || vars.FORCE_FULL == '1' || contains(github.event.head_commit.message, '[force-full]') }}
          GATE_FULL: ${{ inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]') }}
          PARTIAL: ${{ false }}
          EXTRA: ''
        run: node .github/scripts/ci-reuse.mjs check --workflow=mutation --self=.github/workflows/mutation.yml --external=flagship --extra="$EXTRA"
  # ONE job downloads the baseline run's results (with retries) and hands them to every shard as a single artifact: ~260 artifacts
  # downloaded by each of 64 concurrent shards were rate-limited (34 of 256 shards of run 42714273279 still had none after 6
  # attempts and silently ran a full slice). A baseline_run that cannot be fetched fails the run (loud) instead of degrading.
  pool:
    needs: reuse
    name: baseline pool
    if: ${{ needs.reuse.outputs.skip != 'true' && (!(inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      have: ${{ steps.pool.outputs.have }}
    steps:
      - id: pool
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ inputs.baseline_run }}
        run: |
          ids="$BASELINE"
          if [ -z "$ids" ]; then
            ids="$(gh run list -R "$GITHUB_REPOSITORY" --workflow mutation.yml --branch "$GITHUB_REF_NAME" --limit 20 \
                     --json databaseId -q '.[].databaseId' | grep -vx "$GITHUB_RUN_ID" || true)"
          fi
          for id in $ids; do
            for attempt in 1 2 3 4 5 6; do
              rm -rf base
              if gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'mut-results-*' -D base 2>dl.err \
                 && [ -n "$(find base -name '*.src.rb' -print -quit)" ]; then
                echo "have=true" >> "$GITHUB_OUTPUT"
                echo "baseline pool from run $id: $(find base -name '*.json' | wc -l) results file(s), attempt $attempt"; exit 0
              fi
              echo "::warning::baseline download from run $id, attempt $attempt/6 failed: $(tail -c 300 dl.err | tr '\n' ' ')"
              sleep $((attempt * 20))
            done
            [ -n "$BASELINE" ] && { echo "::error::baseline run $BASELINE could not be fetched"; exit 1; }
          done
          echo "have=false" >> "$GITHUB_OUTPUT"
          echo "::notice::no baseline results found, full run (seeds the next run)"
      - uses: actions/upload-artifact@v4
        if: ${{ steps.pool.outputs.have == 'true' }}
        with:
          name: baseline-pool
          path: base/
          retention-days: 2
          compression-level: 6

  # the native libraries of the opt-in modules, built once each (not in every shard of the module): same container image as the
  # shards, uploaded as native-<module>
  natives:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: reuse
    name: native libraries (${{ matrix.module }})
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        module: [pairing, fhe, lwe-ot, fndsa, zk, ada, sandbox-wasm]
    steps:
      - name: Container toolchain
        run: |
          for attempt in 1 2 3; do apt-get update -qq -o Acquire::Retries=5 && break; [ "$attempt" = 3 ] && exit 100; sleep $((attempt * 30)); done
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Acquire::Retries=5 --no-install-recommends git gcc make libc6-dev ca-certificates curl xz-utils zstd gzip cmake g++ pkg-config libclang-dev libffi-dev zlib1g-dev >/dev/null
          git config --global --add safe.directory '*'
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: Build
        run: |
          out="$RUNNER_TEMP/native-out"; mkdir -p "$out"
          case "${{ matrix.module }}" in
            pairing)
              git clone --quiet --depth 1 --branch "$BLST_TAG" https://github.com/supranational/blst "$RUNNER_TEMP/blst"
              test "$(git -C "$RUNNER_TEMP/blst" rev-parse HEAD)" = "$BLST_COMMIT"
              cc -O2 -fPIC -shared -D__BLST_PORTABLE__ -I"$RUNNER_TEMP/blst/bindings" -o "$out/libblst.so" \
                native/pca_gt.c "$RUNNER_TEMP/blst/src/server.c" "$RUNNER_TEMP/blst/build/assembly.S" ;;
            fhe)
              .github/scripts/fhe-seal-corpus.sh "$out/fhe-seal.json.gz" "$MONO/tools/pca-audit/oracles/fhe-seal.mts"
              cp "$(.github/scripts/build-libsealc.sh "$SEAL_TAG" "$RUNNER_TEMP/seal")/libsealc.so" "$out/" ;;
            lwe-ot)
              cp "$(.github/scripts/build-liblweot.sh "$RUNNER_TEMP/lweot" "$MONO/packages/pca-mpc-lwe-ot-wasm/crate" | tail -1)/liblweot.so" "$out/" ;;
            fndsa)
              cp "$(.github/scripts/build-libfndsa.sh "$RUNNER_TEMP/fndsa" "$MONO/packages/pca-fndsa-wasm/crate" | tail -1)/libfndsa.so" "$out/" ;;
            zk)
              cp "$(.github/scripts/build-libpcazk.sh "$RUNNER_TEMP/pcazk" "$MONO/packages/pca-zk/crate" | tail -1)/libpcazk.so" "$out/" ;;
            ada)
              mkdir -p "$RUNNER_TEMP/ada"
              for f in ada.cpp ada.h ada_c.h; do curl -fsSL --retry 4 -o "$RUNNER_TEMP/ada/$f" "https://github.com/ada-url/ada/releases/download/v4.0.0/$f"; done
              g++ -O2 -std=c++20 -shared -fPIC "$RUNNER_TEMP/ada/ada.cpp" -o "$out/libada.so" ;;
            sandbox-wasm)
              .github/scripts/build-wasmtime-host.sh "$out" "$MONO/packages/pca-sandbox/wasmtime-host" >/dev/null
              sha256sum "$out/pca-wasmtime-host" | cut -d' ' -f1 > "$out/host.sha256" ;;
          esac
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.module }}
          path: ${{ runner.temp }}/native-out/
          retention-days: 2
          if-no-files-found: error

  shard:
    needs: [reuse, pool, natives]
    if: ${{ needs.reuse.outputs.skip != 'true' && (!cancelled() && needs.pool.result != 'failure') }}
    name: shard ${{ matrix.shard }}/605 (${{ matrix.files }} ${{ matrix.slice }}/${{ matrix.of }})
    # the ubuntu-26.04 userland (OpenSSL 3.5: ML-DSA / SLH-DSA) in a container on the general runner pool: the
    # ubuntu-26.04 hosted image has a much smaller concurrency pool (~14 jobs where the plan allows 60)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
    defaults:
      run:
        shell: bash
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 256 # Enterprise plan: 500 concurrent jobs org-wide; GitHub queues anything above that
