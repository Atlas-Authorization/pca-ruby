name: Sandbox WebAssembly hosts

# AtlasPca::SandboxWasm: wasmtime-rb core-module host and the pinned-subprocess component host. Runs against the real reference host (pca-wasmtime-host, built here from the flagship's crate and pinned by its SHA-256):
# CI=true makes the real-host tests FAIL when PCA_WASMTIME_HOST_BIN / PCA_WASMTIME_HOST_SHA256 are missing, so a green run never skips them.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Source layout (shared corpus and the reference host crate from the flagship)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --layout
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: wasmtime gem
        run: gem install wasmtime minitest --no-document
      - name: pca-wasmtime-host (cargo build --release; exports PCA_WASMTIME_HOST_BIN and PCA_WASMTIME_HOST_SHA256)
        run: .github/scripts/build-wasmtime-host.sh "$RUNNER_TEMP/wasmtime-host" "$RUNNER_TEMP/pca-flagship/packages/pca-sandbox/wasmtime-host"
      - name: Sandbox host tests
        run: ruby -Ilib -Itest test/test_ref_sandbox_wasm.rb
