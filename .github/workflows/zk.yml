name: zk (libpcazk)

# AtlasPca::ZkNative: Groth16 verification on BN254 and BLS12-381 through ffi over libpcazk (built here from the flagship's zk crate): the
# proof-verification cases of the shared zk corpus, both curves, in the reference-compatible and the strict mode.
# The whole zk corpus is then replayed with the library deciding every pairing question (the main CI replays it on recorded verdicts).
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Source layout (the flagship checkout, which carries the zk crate)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --layout
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: ffi
        run: gem install ffi --no-document
      - name: libpcazk (cargo build --features capi)
        run: echo "ATLAS_PCA_LIBPCAZK=$(.github/scripts/build-libpcazk.sh "$RUNNER_TEMP/pcazk" "$RUNNER_TEMP/pca-flagship/packages/pca-zk/crate" | tail -1)/libpcazk.so" >> "$GITHUB_ENV"
      - name: zk verification replay (a missing corpus fails)
        env:
          ATLAS_PCA_LIBPCAZK_REQUIRED: '1'
        run: |
          test -s test-data/ref-zk.json.gz
          ruby -Ilib -Itest test/test_zk_native.rb
          ruby -Ilib -Itest test/test_ref_zk.rb
